<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="619.3928" height="1000" viewBox="-309.6964 0 619.3928 1000" role="img" aria-labelledby="etc-title etc-desc">
<title id="etc-title">Ethereum Classic logo, mono (rebuilt vector, not an official file)</title>
<desc id="etc-desc">The 2016 faceted Ethereum Classic gem: a notched top piece, a rhombus and a chevron, each split into light and dark facets. Rebuilt from measurements of the logo images Ethereum Classic publishes; the outline is mirror-symmetric left to right and top to bottom. Each piece has a base shape under its facets so no background shows through the seams. Transparent background.</desc>
